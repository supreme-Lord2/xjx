<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#17120d;border:1px solid #a86a2d;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#ffd166}.st{min-height:20px;color:#e9c78e}.grid{width:264px;height:264px;margin:auto;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-radius:10px;background:#6f4d31}.tile{display:flex;align-items:center;justify-content:center;border-radius:7px;background:#9c7551;font-size:24px;font-weight:800}.v2{background:#eee4da;color:#776e65}.v4{background:#f5b97a}.v8{background:#ed8b4c}.v16{background:#e86b3d}.v32{background:#dc4f37}.v64{background:#c9322b}.v128{background:#edcf72;font-size:20px}.v256,.v512,.v1024,.v2048,.v4096,.v8192{background:#edc53f;color:#fff;font-size:18px}.pad{margin:10px auto;display:grid;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center}.pad button{height:40px;border:0;border-radius:9px;background:#74451f;color:#fff;font-size:18px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:3}.pad button:nth-child(4){grid-column:2}.pad button:nth-child(5){grid-column:1}.pad button:nth-child(6){grid-column:3}.hint{font-size:11px;color:#c2a77f}</style>
<div class="card"><h2>🔢 TILES</h2><div id="s" class="st">Level 1 · target 2048 · score 0</div><div id="g" class="grid"></div><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button><button id="n">⟳</button><button id="next">▶|</button></div><div class="hint">Join matching tiles to reach the target</div></div>
<script>(()=>{'use strict';let board=[],score=0,level=1,target=2048,won=false,over=false,grid=document.querySelector('#g'),status=document.querySelector('#s');function addTile(){const empty=board.map((v,i)=>v?null:i).filter(i=>i!==null);if(empty.length)board[empty[Math.random()*empty.length|0]]=Math.random()<.9?2:4}function reset(){target=2048*2**(level-1);board=Array(16).fill(0);score=0;won=false;over=false;addTile();addTile();draw()}function rowsFor(dir){const rows=[];for(let r=0;r<4;r++){const row=[];for(let c=0;c<4;c++){const i=dir==='l'?r*4+c:dir==='r'?r*4+3-c:dir==='u'?c*4+r:(3-c)*4+r;row.push(board[i])}rows.push(row)}return rows}function writeRows(dir,rows){for(let r=0;r<4;r++)for(let c=0;c<4;c++){const i=dir==='l'?r*4+c:dir==='r'?r*4+3-c:dir==='u'?c*4+r:(3-c)*4+r;board[i]=rows[r][c]}}function canMove(){if(board.some(v=>!v))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=board[r*4+c];if(c<3&&v===board[r*4+c+1]||r<3&&v===board[(r+1)*4+c])return true}return false}function nextLevel(){level++;reset();status.textContent='🎉 Level '+level+' · target '+target}function move(dir){if(over||won)return;const before=board.join(','),rows=rowsFor(dir);rows.forEach(row=>{const values=row.filter(Boolean),merged=[];for(let i=0;i<values.length;i++){if(values[i]===values[i+1]){const next=values[i]*2;merged.push(next);score+=next;i++}else merged.push(values[i])}while(merged.length<4)merged.push(0);row.splice(0,4,...merged)});writeRows(dir,rows);if(board.join(',')===before)return;addTile();if(board.includes(target)){won=true;status.textContent='🎉 Level '+level+' complete · tap ▶| for next'}else if(!canMove()){over=true;status.textContent='Game over · press ⟳ to retry'}draw()}function draw(){grid.innerHTML='';board.forEach(v=>{const el=document.createElement('div');el.className='tile '+(v?'v'+v:'');el.textContent=v||'';grid.append(el)});if(!won&&!over)status.textContent='Level '+level+' · target '+target+' · score '+score}const dirs={u:'u',d:'d',l:'l',r:'r'};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(dirs[b.dataset.d]));document.querySelector('#n').onclick=reset;document.querySelector('#next').onclick=nextLevel;onkeydown=e=>{const d={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(d){e.preventDefault();move(d)}};let start;grid.addEventListener('touchstart',e=>{start=e.touches[0]},{passive:true});grid.addEventListener('touchend',e=>{if(!start)return;const q=e.changedTouches[0],dx=q.clientX-start.clientX,dy=q.clientY-start.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));start=null},{passive:true});reset()})();</script>
