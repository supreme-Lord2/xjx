<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#17120d;border:1px solid #a86a2d;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#ffd166}.st{height:20px;color:#e9c78e}.grid{width:264px;height:264px;margin:auto;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-radius:10px;background:#6f4d31}.tile{display:flex;align-items:center;justify-content:center;border-radius:7px;background:#9c7551;font-size:24px;font-weight:800}.v2{background:#eee4da;color:#776e65}.v4{background:#f5b97a}.v8{background:#ed8b4c}.v16{background:#e86b3d}.v32{background:#dc4f37}.v64{background:#c9322b}.v128{background:#edcf72;font-size:20px}.v256,.v512,.v1024,.v2048{background:#edc53f;color:#fff;font-size:18px}.pad{margin:10px auto;display:grid;grid-template-columns:repeat(3,54px);gap:5px;justify-content:center}.pad button{height:40px;border:0;border-radius:9px;background:#74451f;color:#fff;font-size:18px}.pad button:nth-child(2){grid-column:2}.pad button:nth-child(3){grid-column:1}.pad button:nth-child(4){grid-column:3}.pad button:nth-child(5){grid-column:2}.hint{font-size:11px;color:#c2a77f}</style><div class="card"><h2>🔢 TILES</h2><div id="s" class="st">Score: 0</div><div id="g" class="grid"></div><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button><button id="n">⟳</button></div><div class="hint">Join matching tiles to reach 2048</div></div><script>(()=>{let a=[],score=0,g=document.querySelector('#g'),st=document.querySelector('#s');function add(){let e=a.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!e.length)return;let i=e[Math.random()*e.length|0];a[i]=Math.random()<.9?2:4}function init(){a=Array(16).fill(0);score=0;add();add();draw()}function line(d){let rows=[];for(let r=0;r<4;r++){let q=[];for(let c=0;c<4;c++){let i=d==='l'?r*4+c:d==='r'?r*4+3-c:d==='u'?c*4+r:(3-c)*4+r;q.push(a[i])}rows.push(q)}return rows}function move(d){let rows=line(d),changed=false;rows=rows.map(q=>{let z=q.filter(Boolean),out=[];for(let i=0;i<z.length;i++){if(z[i]===z[i+1]){out.push(z[i]*2);score+=z[i]*2;i++}else out.push(z[i])}while(out.length<4)out.push(0);if(out.join()!=q.join())changed=true;return out});if(!changed)return;for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=d==='l'?r*4+c:d==='r'?r*4+3-c:d==='u'?c*4+r:(3-c)*4+r;a[i]=rows[r][c]}add();draw()}function draw(){g.innerHTML='';a.forEach(v=>{let e=document.createElement('div');e.className='tile '+(v?'v'+v:'');e.textContent=v||'';g.append(e)});st.textContent='Score: '+score}let ds={u:'u',d:'d',l:'l',r:'r'};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(ds[b.dataset.d]));onkeydown=e=>{let d={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(d)move(d)};document.querySelector('#n').onclick=init;init()})();</script>
