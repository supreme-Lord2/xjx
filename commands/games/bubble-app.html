<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#081522;border:1px solid #167fa5;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#67e8f9}.st{height:20px;color:#a7ddea}canvas{width:264px;height:300px;background:#06101c;border-radius:10px;border:1px solid #145b78;touch-action:none}.row button{margin:8px 3px 0;padding:8px 18px;border:0;border-radius:9px;background:#155e75;color:#fff}.hint{font-size:11px;color:#86b8c7}</style><div class="card"><h2>🫧 BUBBLE SHOOTER</h2><div id="s" class="st">Aim and tap to shoot</div><canvas id="c" width="264" height="300"></canvas><div class="row"><button id="r">⟳ New game</button></div><div class="hint">Tap the board to aim · match 3 bubbles</div></div><script>(()=>{let c=document.querySelector('#c'),x=c.getContext('2d'),st=document.querySelector('#s'),B=[],score=0,shot;const C=['#ff5c8a','#ffd166','#67e8f9','#a78bfa','#6ee7a0'];function init(){B=[];score=0;for(let r=0;r<5;r++)for(let q=0;q<8;q++)B.push({x:18+q*32,y:18+r*27,c:C[Math.random()*C.length|0]});shot=C[Math.random()*C.length|0];draw()}function draw(){x.clearRect(0,0,264,300);B.forEach(b=>{x.fillStyle=b.c;x.beginPath();x.arc(b.x,b.y,12,0,7);x.fill();x.strokeStyle='#ffffff55';x.stroke()});x.fillStyle=shot;x.beginPath();x.arc(132,280,13,0,7);x.fill();st.textContent='Score: '+score+' · next bubble'}function shoot(e){let r=c.getBoundingClientRect(),tx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,ty=(e.touches?e.touches[0].clientY:e.clientY)-r.top;let hit=B.filter(b=>Math.hypot(b.x-tx,b.y-ty)<28).sort((a,b)=>b.y-a.y)[0];let y=hit?hit.y+27:45,q=Math.max(18,Math.min(246,Math.round(tx/32)*32+2));let b={x:q,y,c:shot};B.push(b);let near=B.filter(v=>v!==b&&v.c===b.c&&Math.hypot(v.x-b.x,v.y-b.y)<38);if(near.length>=2){B=B.filter(v=>v!==b&&!near.includes(v));score+=30}if(B.some(v=>v.y>250)){st.textContent='Game over · tap New game';c.removeEventListener('click',shoot)}shot=C[Math.random()*C.length|0];draw()}c.addEventListener('click',shoot);document.querySelector('#r').onclick=()=>{c.removeEventListener('click',shoot);c.addEventListener('click',shoot);init()};init()})();</script>
