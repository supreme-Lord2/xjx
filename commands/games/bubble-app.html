<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#081522;border:1px solid #167fa5;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#67e8f9}.st{min-height:20px;color:#a7ddea}canvas{width:264px;height:300px;background:#06101c;border-radius:10px;border:1px solid #145b78;touch-action:none}.row button{margin:8px 3px 0;padding:8px 18px;border:0;border-radius:9px;background:#155e75;color:#fff}.controls button{min-width:48px}.hint{font-size:11px;color:#86b8c7}
</style>
<div class="card"><h2>🫧 BUBBLE SHOOTER</h2><div id="s" class="st">Aim, then tap to shoot</div><canvas id="c" width="264" height="300"></canvas><div class="row controls"><button id="left">◀</button><button id="fire">● Shoot</button><button id="right">▶</button><button id="r">⟳ New game</button></div><div class="hint">Aim with the pointer or buttons · match 3 or more</div></div>
<script>
(()=>{
'use strict';const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),status=document.querySelector('#s'),COLS=8,ROWS=10,R=12,STEPX=32,STEPY=27,colors=['#ff5c8a','#ffd166','#67e8f9','#a78bfa','#6ee7a0'];let grid,score,shot,aimX=132,gameOver=false;
function emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function reset(){grid=emptyGrid();score=0;gameOver=false;for(let r=0;r<5;r++)for(let c=0;c<COLS;c++)grid[r][c]=colors[Math.random()*colors.length|0];shot=colors[Math.random()*colors.length|0];status.textContent='Aim, then tap to shoot';draw()}
function pos(c,r){return{x:18+c*STEPX,y:18+r*STEPY}}
function neighbors(c,r){return[[c-1,r],[c+1,r],[c,r-1],[c,r+1],[c-1,r+1],[c+1,r+1],[c-1,r-1],[c+1,r-1]].filter(([x,y])=>x>=0&&x<COLS&&y>=0&&y<ROWS)}
function group(c,r,color){const out=[],seen=new Set(),todo=[[c,r]];while(todo.length){const [x,y]=todo.pop(),k=x+','+y;if(seen.has(k)||grid[y]?.[x]!==color)continue;seen.add(k);out.push([x,y]);neighbors(x,y).forEach(n=>todo.push(n))}return out}
function dropFloating(){const seen=new Set(),todo=[];for(let c=0;c<COLS;c++)if(grid[0][c])todo.push([c,0]);while(todo.length){const [c,r]=todo.pop(),k=c+','+r;if(seen.has(k)||!grid[r]?.[c])continue;seen.add(k);neighbors(c,r).forEach(n=>todo.push(n))}for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&!seen.has(c+','+r)){grid[r][c]=null;score+=10}}
function attach(c){let row=-1;for(let r=0;r<ROWS;r++){if(!grid[r][c]&&(r===0||grid[r-1][c])){row=r;break}}if(row<0)return false;grid[row][c]=shot;const g=group(c,row,shot);if(g.length>=3){g.forEach(([x,y])=>grid[y][x]=null);score+=g.length*10;dropFloating()}shot=colors[Math.random()*colors.length|0];if(grid.some(row=>row.some(v=>v)&&row===grid[ROWS-1]))gameOver=true;return true}
function shoot(){if(gameOver)return;const c=Math.max(0,Math.min(COLS-1,Math.round((aimX-18)/STEPX)));if(!attach(c)){gameOver=true}if(gameOver)status.textContent='Game over · press New game';draw()}
function draw(){ctx.clearRect(0,0,264,300);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){const p=pos(c,r);ctx.fillStyle=grid[r][c];ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.stroke()}if(!gameOver){ctx.strokeStyle='#ffffff66';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(132,270);ctx.lineTo(aimX,70);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle=shot;ctx.beginPath();ctx.arc(132,280,13,0,Math.PI*2);ctx.fill();if(!gameOver)status.textContent='Score: '+score+' · next bubble'}
function pointer(e){const r=canvas.getBoundingClientRect(),p=e.touches?.[0]||e;aimX=(p.clientX-r.left)*(canvas.width/r.width);if(e.type==='pointerdown'||e.type==='click')shoot();draw()}
canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',pointer);document.querySelector('#left').onclick=()=>{aimX=Math.max(18,aimX-24);draw()};document.querySelector('#right').onclick=()=>{aimX=Math.min(246,aimX+24);draw()};document.querySelector('#fire').onclick=shoot;document.querySelector('#r').onclick=reset;reset()
})();
</script>
