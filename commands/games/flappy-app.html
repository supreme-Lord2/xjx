<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#08182a;border:1px solid #2e86ab;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#7dd3fc}.st{min-height:20px;color:#a9d9ec}canvas{width:264px;height:300px;background:linear-gradient(#38a7d1,#b7e8e9);border-radius:10px;touch-action:none}.button{margin:8px 3px 0;padding:8px 14px;border:0;border-radius:9px;background:#126181;color:#fff}.hint{font-size:11px;color:#8eb5c7}</style>
<div class="card"><h2>🐤 FLAPPY</h2><div id="s" class="st">Level 1 · tap to start</div><canvas id="c" width="264" height="300"></canvas><button class="button" id="f">▲ FLAP</button><button class="button" id="r">⟳ Restart</button><button class="button" id="n">▶| Next level</button><div class="hint">Tap, click, or press Space to flap</div></div>
<script>(()=>{'use strict';const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),status=document.querySelector('#s'),W=264,H=300,BIRD_X=28;let birdY,velocity,score,pipes,started,over,raf,level=1,speed,gapSize;function newPipe(x){return{x,gap:72+Math.random()*145,passed:false}}function round(){cancelAnimationFrame(raf);birdY=145;velocity=0;started=false;over=false;pipes=[];for(let i=0;i<4;i++)pipes.push(newPipe(300+i*120));status.textContent='Level '+level+' · tap to start';draw()}function fresh(){level=1;score=0;speed=2;gapSize=84;round()}function next(){level++;score=0;speed=2+(level-1)*.35;gapSize=Math.max(58,84-(level-1)*6);round()}function flap(){if(over){round();return}if(!started){started=true;raf=requestAnimationFrame(loop)}velocity=-6}function loop(){velocity+=.28;birdY+=velocity;pipes.forEach(p=>p.x-=speed);if(pipes[0].x<-44){pipes.shift();pipes.push(newPipe(435))}pipes.forEach(p=>{if(!p.passed&&p.x+42<BIRD_X){p.passed=true;score++;if(score%5===0){level++;speed=2+(level-1)*.35;gapSize=Math.max(58,84-(level-1)*6)}}});const hit=birdY-13<0||birdY+13>290||pipes.some(p=>p.x<BIRD_X+13&&p.x+42>BIRD_X-13&&(birdY-13<p.gap-gapSize/2||birdY+13>p.gap+gapSize/2));if(hit){over=true;status.textContent='💥 Level '+level+' over · score '+score+' · tap to retry';draw();return}status.textContent='Level '+level+' · score '+score;draw();raf=requestAnimationFrame(loop)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#4a9b4a';pipes.forEach(p=>{ctx.fillRect(p.x,0,42,p.gap-gapSize/2);ctx.fillRect(p.x,p.gap+gapSize/2,42,H)});ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(BIRD_X,birdY,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(0,290,W,10);if(!started&&!over){ctx.fillStyle='#123';ctx.font='bold 14px system-ui';ctx.fillText('TAP TO FLAP',82,135)}}canvas.addEventListener('pointerdown',flap);document.querySelector('#f').onclick=flap;document.querySelector('#r').onclick=fresh;document.querySelector('#n').onclick=next;onkeydown=e=>{if(e.code==='Space'){e.preventDefault();flap()}};fresh()})();</script>
