<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#fff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#08182a;border:1px solid #2e86ab;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#7dd3fc}.st{height:20px;color:#a9d9ec}canvas{width:264px;height:300px;background:linear-gradient(#38a7d1,#b7e8e9);border-radius:10px;touch-action:none}.button{margin:9px;padding:8px 24px;border:0;border-radius:9px;background:#126181;color:#fff}.hint{font-size:11px;color:#8eb5c7}</style><div class="card"><h2>🐤 FLAPPY</h2><div id="s" class="st">Tap to flap</div><canvas id="c" width="264" height="300"></canvas><button class="button" id="r">⟳ Restart</button><div class="hint">Tap, click, or press Space to fly</div></div><script>(()=>{let c=document.querySelector('#c'),x=c.getContext('2d'),st=document.querySelector('#s'),y,vy,score,over,obs,t;function init(){y=140;vy=0;score=0;over=false;obs=[];for(let i=0;i<4;i++)obs.push({x:300+i*120,g:70+Math.random()*120});cancelAnimationFrame(t);loop()}function flap(){if(over)return init();vy=-6}function loop(){vy+=.28;y+=vy;obs.forEach(o=>o.x-=2);if(obs[0].x<-45){obs.shift();obs.push({x:435,g:65+Math.random()*130});score++}let hit=y<0||y>290||obs.some(o=>o.x<35&&o.x+42>15&&(y<o.g-42||y>o.g+42));if(hit){over=true;st.textContent='💥 Game over · score '+score+' · tap to retry'}else{st.textContent='Score: '+score; t=requestAnimationFrame(loop)}draw()}function draw(){x.clearRect(0,0,264,300);x.fillStyle='#4a9b4a';obs.forEach(o=>{x.fillRect(o.x,0,42,o.g-42);x.fillRect(o.x,o.g+42,42,300)});x.fillStyle='#facc15';x.beginPath();x.arc(28,y,13,0,7);x.fill();x.fillStyle='#fff';x.fillRect(0,290,264,10)}c.onclick=flap;document.querySelector('#r').onclick=init;onkeydown=e=>{if(e.code==='Space')flap()};init()})();</script>
