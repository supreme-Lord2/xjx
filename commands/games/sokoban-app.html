<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#eadcff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#10091f;border:1px solid #6336a8;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#d8b4fe}.st{color:#bba5d6;height:20px}canvas{width:240px;height:240px;border-radius:10px;background:#1b1230;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(4,44px);gap:6px;justify-content:center;margin-top:10px}.pad button{height:44px;border:1px solid #6941a5;border-radius:10px;background:#2c1850;color:#fff;font-size:18px}.pad button:nth-child(1){grid-column:2;grid-row:1}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:3;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:3}.pad button:nth-child(5){grid-column:2;grid-row:4}.hint{font-size:11px;color:#9b86b8}
</style>
<div class="card"><h2>📦 SOKOBAN</h2><div id="s" class="st">Push every box onto a goal</div><canvas id="c" width="240" height="240"></canvas><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button><button id="reset">⟳</button></div><div class="hint">Push boxes, don't pull them · swipe or use buttons</div></div>
<script>
(()=>{
'use strict';
const cv=document.querySelector('#c'),ctx=cv.getContext('2d'),status=document.querySelector('#s'),N=8,CELL=30;
const BASE=['########','# .    #','# $    #','#  @ $ #','# .    #','#      #','#      #','########'];
let terrain,player,boxes,moves;
function reset(){terrain=BASE.map(row=>row.padEnd(N,'#').slice(0,N).split(''));boxes=[];moves=0;player=null;terrain.forEach((row,y)=>row.forEach((v,x)=>{if(v==='@'){player={x,y};terrain[y][x]=' '}if(v==='$'){boxes.push({x,y});terrain[y][x]=' '}}));status.textContent='Push every box onto a goal';draw()}
function cell(x,y){return terrain[y]?.[x]}
function move(dx,dy){if(!player)return;const nx=player.x+dx,ny=player.y+dy;if(cell(nx,ny)==='#')return;const bi=boxes.findIndex(b=>b.x===nx&&b.y===ny);if(bi>=0){const bx=nx+dx,by=ny+dy;if(cell(bx,by)==='#'||boxes.some(b=>b.x===bx&&b.y===by))return;boxes[bi]={x:bx,y:by}}player={x:nx,y:ny};moves++;draw();if(boxes.length&&boxes.every(b=>cell(b.x,b.y)==='.'))status.textContent='🎉 Solved in '+moves+' moves!'}
function draw(){ctx.clearRect(0,0,240,240);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=cell(x,y);ctx.fillStyle=v==='#'?'#332051':'#171025';ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);if(v==='.'){ctx.fillStyle='#f4c95d';ctx.beginPath();ctx.arc(x*CELL+15,y*CELL+15,7,0,Math.PI*2);ctx.fill()}}boxes.forEach(b=>{ctx.fillStyle=cell(b.x,b.y)==='.'?'#ffd166':'#b56bff';ctx.fillRect(b.x*CELL+5,b.y*CELL+5,20,20)});if(player){ctx.fillStyle='#74f0b0';ctx.beginPath();ctx.arc(player.x*CELL+15,player.y*CELL+15,10,0,Math.PI*2);ctx.fill()}}
const dirs={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...dirs[b.dataset.d]));document.querySelector('#reset').onclick=reset;onkeydown=e=>{const d={ArrowUp:dirs.u,ArrowDown:dirs.d,ArrowLeft:dirs.l,ArrowRight:dirs.r}[e.key];if(d){e.preventDefault();move(...d)}};let touch;cv.addEventListener('touchstart',e=>{touch=e.touches[0]},{passive:true});cv.addEventListener('touchend',e=>{if(!touch)return;const q=e.changedTouches[0],dx=q.clientX-touch.clientX,dy=q.clientY-touch.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(...(Math.abs(dx)>Math.abs(dy)?(dx>0?dirs.r:dirs.l):(dy>0?dirs.d:dirs.u)));touch=null},{passive:true});reset()
})();
</script>
