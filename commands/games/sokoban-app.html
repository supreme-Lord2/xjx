<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;font:14px system-ui;color:#eadcff;text-align:center}.card{max-width:310px;margin:auto;padding:12px;border-radius:16px;background:#10091f;border:1px solid #6336a8;box-shadow:0 5px 20px #000b}h2{margin:2px;color:#d8b4fe}.st{color:#bba5d6;height:20px}canvas{width:240px;height:240px;border-radius:10px;background:#1b1230;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:10px}.pad button{height:44px;border:1px solid #6941a5;border-radius:10px;background:#2c1850;color:#fff;font-size:18px}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.pad button:nth-child(5){grid-column:2}.hint{font-size:11px;color:#9b86b8}</style><div class="card"><h2>📦 SOKOBAN</h2><div id="s" class="st">Push every box onto a goal</div><canvas id="c" width="240" height="240"></canvas><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button><button id="reset">⟳</button></div><div class="hint">Push boxes, don't pull them · swipe or use buttons</div></div><script>(()=>{const cv=document.querySelector('#c'),x=cv.getContext('2d'),st=document.querySelector('#s'),N=8;let level=['########',' #  .  #',' # $$  #',' #  @  #',' #  .  #',' #    ##',' ########','########'].map(r=>r.padEnd(8,'#').split(''));let p,b,moves=0;function init(){p=null;b=[];moves=0;level.forEach((r,y)=>r.forEach((v,z)=>{if(v==='@'){p={x:z,y};level[y][z]=' '}if(v==='$'){b.push({x:z,y});level[y][z]=' '}}));draw()}function at(a,y,z){return a[y]?.[z]}function go(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(at(level,ny,nx)==='#')return;let q=b.findIndex(v=>v.x===nx&&v.y===ny);if(q>=0){let bx=nx+dx,by=ny+dy;if(at(level,by,bx)==='#'||b.some(v=>v.x===bx&&v.y===by))return;b[q]={x:bx,y:by}}p={x:nx,y:ny};moves++;draw();if(b.every(v=>level[v.y][v.x]==='.'))st.textContent='🎉 Solved in '+moves+' moves!'}function draw(){x.clearRect(0,0,240,240);let c=30;for(let y=0;y<N;y++)for(let z=0;z<N;z++){let v=level[y][z];x.fillStyle=v==='#'?'#332051':'#171025';x.fillRect(z*c,y*c,c-1,c-1);if(v==='.')x.fillStyle='#f4c95d',x.beginPath(),x.arc(z*c+15,y*c+15,7,0,7),x.fill()}b.forEach(v=>{x.fillStyle=level[v.y][v.x]==='.'?'#ffd166':'#b56bff';x.fillRect(v.x*c+5,v.y*c+5,20,20)});x.fillStyle='#74f0b0';x.beginPath();x.arc(p.x*c+15,p.y*c+15,10,0,7);x.fill()}document.querySelectorAll('[data-d]').forEach(q=>q.onclick=()=>{let d={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[q.dataset.d];go(...d)});document.querySelector('#reset').onclick=init;onkeydown=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d)go(...d)};init()})();</script>
